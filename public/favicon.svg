<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#0f1011"/>

  <!-- top-left: hands at 12 and 6 (vertical) -->
  <circle cx="8" cy="8" r="6.5" fill="#1c1e21" stroke="#2d3035" stroke-width="0.6"/>
  <line x1="8" y1="8" x2="8" y2="3"   stroke="#d8dadf" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="8" y1="8" x2="8" y2="13"  stroke="#d8dadf" stroke-width="0.9" stroke-linecap="round"/>

  <!-- top-right: hands at 3 and 9 (horizontal) -->
  <circle cx="24" cy="8" r="6.5" fill="#1c1e21" stroke="#2d3035" stroke-width="0.6"/>
  <line x1="24" y1="8" x2="29" y2="8"  stroke="#d8dadf" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="24" y1="8" x2="19" y2="8"  stroke="#d8dadf" stroke-width="0.9" stroke-linecap="round"/>

  <!-- bottom-left: hands at 10:30 and 4:30 (\ diagonal) -->
  <circle cx="8" cy="24" r="6.5" fill="#1c1e21" stroke="#2d3035" stroke-width="0.6"/>
  <line x1="8" y1="24" x2="5.2" y2="19.4" stroke="#d8dadf" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="8" y1="24" x2="10.8" y2="28.6" stroke="#d8dadf" stroke-width="0.9" stroke-linecap="round"/>

  <!-- bottom-right: hands at 1:30 and 7:30 (/ diagonal) -->
  <circle cx="24" cy="24" r="6.5" fill="#1c1e21" stroke="#2d3035" stroke-width="0.6"/>
  <line x1="24" y1="24" x2="26.8" y2="19.4" stroke="#d8dadf" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="21.2" y2="28.6" stroke="#d8dadf" stroke-width="0.9" stroke-linecap="round"/>
</svg>
